{{- /* Article du blog. */ -}}
{{ define "main" }}
<div class="conteneur">
  <article class="article">
    <header class="tete-page">
      <p class="ia-eyebrow"><a href="{{ (site.GetPage "/blog").RelPermalink }}">Blog</a></p>
      <h1 class="tete-page__titre">{{ .Title }}</h1>
      <p class="tete-page__meta">{{ with site.Params.auteur }}{{ . }} · {{ end }}{{ partial "date.html" .Date }} · Lecture : {{ .ReadingTime }} min</p>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    <p class="article__retour"><a class="ia-btn ia-btn--ghost" href="{{ (site.GetPage "/blog").RelPermalink }}"><span class="ia-btn__arrow">←</span> Tous les articles</a></p>
  </article>
</div>
{{ end }}
