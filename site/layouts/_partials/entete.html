<header class="ia-header">
  <a class="ia-header__logo" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}><img src="{{ "images/logo-horizontal.svg" | relURL }}" alt="jerlash.labs" width="160" height="24"></a>
  <nav class="ia-header__nav" aria-label="Navigation principale">
    {{- $page := . }}
    {{- range site.Menus.principal }}
    {{- $actuel := false }}
    {{- with .Page }}{{ $actuel = or (eq $page .) ($page.IsDescendant .) }}{{ end }}
    <a href="{{ .URL }}"{{ if $actuel }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
