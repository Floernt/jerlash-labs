<header class="entete-site">
  <div class="conteneur entete-site__interieur">
    <a class="nom-site" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>iavocat<span class="nom-site__suffixe">.be</span></a>
    <nav aria-label="Navigation principale">
      <ul class="menu-principal">
        {{- $page := . }}
        {{- range site.Menus.principal }}
        {{- $actuel := or ($page.IsMenuCurrent "principal" .) ($page.HasMenuCurrent "principal" .) }}
        {{- if and .Page (not $actuel) }}{{ $actuel = or (eq $page .Page) ($page.IsDescendant .Page) }}{{ end }}
        <li><a href="{{ .URL }}"{{ if $actuel }} aria-current="{{ if eq $page .Page }}page{{ else }}true{{ end }}"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
