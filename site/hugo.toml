# Configuration Hugo du site jerlash.labs (ADR-022)
# Version de Hugo figée : extended 0.148.2 (ADR-002). Aucun thème tiers.

# Adresse définitive passée à la construction par la publication (--baseURL, GitHub Pages)
baseURL = "/"
title = "jerlash.labs"
# Bilingue (ADR-023) : le français est la version maître (content/x.md), l'anglais
# sa traduction (content/x.en.md), tenue à jour par scripts/traductions.py et /traduire.
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = true
timeZone = "Europe/Brussels"
# Titres générés (tâches) : majuscule initiale seulement
titleCaseStyle = "firstupper"

# robots.txt est un fichier statique (static/robots.txt)
enableRobotsTXT = false
# Pas de balise meta « generator »
disableHugoGeneratorInject = true
# Pages de taxonomie désactivées tant que les outils sont en brouillon (ADR-022)
disableKinds = ["taxonomy", "term"]
# URL sans accents (ex. /taches/preparer-un-document/)
removePathAccents = true

# Taxonomie unique : les tâches auxquelles répond un outil
[taxonomies]
  # Taxonomie des outils (sections en brouillon, ADR-022)
  tache = "taches"

# Formats produits : RSS uniquement pour la section Nouveautés (voir cascade)
[outputs]
  home = ["html"]
  page = ["html"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[[cascade]]
  outputs = ["html", "rss"]
  [cascade.target]
    path = "/blog"
    kind = "section"

[services.rss]
  limit = 50

[sitemap]
  changeFreq = ""
  filename = "sitemap.xml"
  priority = -1

# Date de dernière modification (plan du site, tris) : on reprend les
# paramètres métier des outils et des guides lorsqu'ils existent.
[frontmatter]
  lastmod = ["mise_a_jour", "derniere_verification", "lastmod", ":default"]

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      # Identifiants d'ancres sans accents (« sous-etape » plutôt que « sous-étape »)
      autoHeadingIDType = "github-ascii"
    [markup.goldmark.renderer]
      # Aucun HTML brut dans le Markdown
      unsafe = false
    [markup.highlight]
    # Classes CSS plutôt que styles en ligne (CSP style-src 'self')
    noClasses = false
    codeFences = true
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  auteur = "Florian Ernotte"
  # Seuil, en mois, au-delà duquel un guide affiche un avertissement
  guides_mois_avant_avertissement = 6

[languages]
  [languages.fr]
    weight = 1
    languageCode = "fr-BE"
    languageName = "Français"
    [languages.fr.params]
      description = "Intelligence artificielle et pratique d'un cabinet d'avocats : articles de Florian Ernotte, et bientôt les outils qu'il construit."
      locale = "fr_BE"
      # Ordre d'affichage des tâches dans le catalogue des outils (clés de la taxonomie).
      # Les tâches absentes de cette liste s'affichent ensuite, par ordre alphabétique.
      ordre_taches = ["préparer un document", "vérifier", "analyser un dossier", "comparer", "structurer"]
    # Guillemets français avec espaces insécables
    [languages.fr.markup.goldmark.extensions.typographer]
      leftDoubleQuote = "&laquo;&nbsp;"
      rightDoubleQuote = "&nbsp;&raquo;"
    [[languages.fr.menus.principal]]
      name = "Blog"
      pageRef = "/blog"
      weight = 10
    [[languages.fr.menus.principal]]
      name = "À propos"
      pageRef = "/a-propos"
      weight = 20
    [[languages.fr.menus.pied]]
      name = "À propos"
      pageRef = "/a-propos"
      weight = 10
    [[languages.fr.menus.pied]]
      name = "Mentions légales"
      pageRef = "/mentions-legales"
      weight = 20
    [[languages.fr.menus.pied]]
      name = "Confidentialité"
      pageRef = "/confidentialite"
      weight = 30

  [languages.en]
    weight = 2
    languageCode = "en-GB"
    languageName = "English"
    [languages.en.params]
      description = "Artificial intelligence and the practice of a law firm: articles by Florian Ernotte, and soon the tools he builds."
      locale = "en_GB"
      ordre_taches = ["prepare a document", "check", "analyse a case file", "compare", "structure"]
    # Rubriques aux noms anglais (les pages portent leur propre slug anglais)
    [languages.en.permalinks.section]
      outils = "/tools/"
      nouveautes = "/updates/"
      automatiser = "/automation/"
      taches = "/tasks/"
    [languages.en.permalinks.page]
      outils = "/tools/:slug/"
      nouveautes = "/updates/:slug/"
      automatiser = "/automation/:slug/"
    [languages.en.permalinks.term]
      taches = "/tasks/:slug/"
    [languages.en.permalinks.taxonomy]
      taches = "/tasks/"
    [[languages.en.menus.principal]]
      name = "Blog"
      pageRef = "/blog"
      weight = 10
    [[languages.en.menus.principal]]
      name = "About"
      pageRef = "/a-propos"
      weight = 20
    [[languages.en.menus.pied]]
      name = "About"
      pageRef = "/a-propos"
      weight = 10
    [[languages.en.menus.pied]]
      name = "Legal notice"
      pageRef = "/mentions-legales"
      weight = 20
    [[languages.en.menus.pied]]
      name = "Privacy"
      pageRef = "/confidentialite"
      weight = 30
