# Programmes de recherche de jerlash.labs.
# Seul endroit où figurent les noms affichés : le site ne montre jamais les codes (décision de Florian, 2026-11-07).
# Le code (H1, C1, T1) sert uniquement au rattachement, par le champ « programme » des pages.
# « slug » est la fin de l'adresse de la page du programme (/recherche/<slug>/) et la valeur du filtre (?programme=<slug>).
# « couleur » donne la teinte dominante des visuels de projet (scripts/visuels.py) : brique, bleu ou encre.
# « motif » est le motif du visuel du programme (orbe, anneau, colonnes, diagonale, constellation, spirale).
# Noms arrêtés par Florian le 2026-11-07, en français et en anglais.

- code: H1
  motif: orbe
  couleur: brique
  ordre: 1
  fr:
    nom: "Autonomie & IA"
    slug: "autonomie-ia"
    accroche: "Autonomie, supervision et jugement de l'avocat qui travaille avec l'IA."
  en:
    nom: "Agency & AI"
    slug: "agency-ai"
    accroche: "Autonomy, oversight and judgment of lawyers working with AI."

- code: C1
  motif: constellation
  couleur: bleu
  ordre: 2
  fr:
    nom: "Ingénierie juridique"
    slug: "ingenierie-juridique"
    accroche: "Formaliser et transmettre les connaissances juridiques."
  en:
    nom: "Legal engineering"
