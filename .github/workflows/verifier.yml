# Vérification de chaque modification : secrets, tests des outils, archive, site.
# Versions des actions et du système figées, revues le 2026-11-06 (Node.js 24) ; à revoir à chaque avertissement de GitHub (ADR-003).
name: Vérification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.148.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer Hugo extended (version figée, ADR-002)
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Tableur Gouvernance de l'IA (fichier versionné dans le dépôt, ADR-030)
        run: |
          mkdir -p site/static/telechargements
          cp outils/gouvernance-ia/tableur/gouvernance-ia-matrices-*.xlsx site/static/telechargements/
      - name: Vérification complète
        run: python scripts/verifier.py --exiger-hugo
